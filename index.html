<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fight Week">

<link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body>
<header class="band">
  <div class="wrap">
    <h1 class="brand"><small>Friends pick'em league</small>Fight Week</h1>
    <button class="menubtn" id="menu-btn" aria-label="Menu" aria-haspopup="true" aria-expanded="false" aria-controls="menu" hidden><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    <div class="me" id="me" hidden></div>
    <nav class="tabs" role="tablist" id="tabs" hidden>
      <button class="tab" role="tab" data-tab="picks" aria-selected="true">Picks</button>
      <button class="tab" role="tab" data-tab="board" aria-selected="false">Standings</button>
    </nav>
  </div>
</header>
<div class="wrap"><main id="app">
  <div class="empty"><h3>Loading</h3><p>Connecting to your league.</p></div>
</main></div>
<div class="menu-scrim" id="menu-scrim" hidden></div>
<nav class="menu" id="menu" aria-label="Menu" hidden>

  <button data-page="app"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg>Get the app</button>
  <hr>
  <button data-act="signout"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H3"/></svg>Sign out</button>
</nav>
<div class="toast" id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

</body>
</html>
